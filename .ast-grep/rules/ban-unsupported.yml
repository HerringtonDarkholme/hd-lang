# `unsupported` is banned (owner, 2026-11-08: "ban the fucking shit"). A refusal
# of a program the spec accepts is a gap; a refusal of a case an earlier stage
# rules out is dead code. No new site may be added: implement the case, or
# reject the program by a real spec rule with its own diagnostic code and ticket
# the gap. scripts/check-sloppy.ts counts this rule's matches per crate
# against scripts/sloppy-ceiling.tsv, which only goes down (#1489, #1490).
id: ban-unsupported
language: Rust
severity: error
message: unsupported is banned; implement the case or reject it by a real spec rule
files:
  - crates/*/src/**/*.rs
ignores:
  - crates/*/src/**/tests.rs
  - crates/*/src/**/*_tests.rs
  - crates/*/src/**/test_*.rs
  - crates/*/src/**/tests/**
  - crates/hd_testkit/**
rule:
  any:
    - kind: call_expression
      has:
        field: function
        regex: '(^|::|\.)unsupported$'
    - kind: scoped_identifier
      regex: '^(hd_diag::)?Code::Unsupported$'
  not:
    inside:
      stopBy: end
      matches: cfg-test-item
utils:
  cfg-test-item:
    any:
      - kind: mod_item
      - kind: function_item
      - kind: impl_item
    follows:
      stopBy:
        not:
          any:
            - kind: attribute_item
            - kind: line_comment
            - kind: block_comment
      kind: attribute_item
      regex: '^#\[(test|cfg\(test\))\]$'
