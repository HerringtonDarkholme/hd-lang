# Sloppy code in the compiler core, outside tests (owner, 2026-11-08: "unsupported is
# just one kind of sloppy code"; "it should only be banned in compiler core and not in test").
# scripts/check-sloppy.ts counts this rule's matches per crate against
# scripts/sloppy-ceiling.tsv, which only goes down.
id: sloppy-std-path
language: Rust
severity: error
message: "the compiler names a std item by path; go through a known-items entry or a general rule"
files:
  - crates/hd_syntax/src/**/*.rs
  - crates/hd_resolve/src/**/*.rs
  - crates/hd_types/src/**/*.rs
  - crates/hd_check/src/**/*.rs
  - crates/hd_tir/src/**/*.rs
  - crates/hd_mono/src/**/*.rs
  - crates/hd_opt/src/**/*.rs
  - crates/hd_wasm_linear/src/**/*.rs
  - crates/hd_structure/src/**/*.rs
  - crates/hd_driver/src/**/*.rs
ignores:
  # The known-items table is where std items are named by path, once each: the
  # message's own remedy. Every other path string is the sloppy kind.
  - crates/hd_resolve/src/known.rs
  - crates/*/src/**/tests.rs
  - crates/*/src/**/*_tests.rs
  - crates/*/src/**/test_*.rs
  - crates/*/src/**/tests/**
  - crates/hd_testkit/**
rule:
  kind: string_literal
  regex: '^"std\.[a-z_]+'
  not:
    inside:
      stopBy: end
      matches: cfg-test-item
utils:
  cfg-test-item:
    any:
      - kind: mod_item
      - kind: function_item
      - kind: impl_item
    follows:
      stopBy:
        not:
          any:
            - kind: attribute_item
            - kind: line_comment
            - kind: block_comment
      kind: attribute_item
      regex: '^#\[(test|cfg\(test\))\]$'
