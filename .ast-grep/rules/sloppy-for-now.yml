# Sloppy code (owner, 2026-11-08: "unsupported is just one kind of sloppy code").
# scripts/check-sloppy.ts counts this rule's matches per crate against
# scripts/sloppy-ceiling.tsv, which only goes down.
id: sloppy-for-now
language: Rust
severity: error
message: "a comment admits a shortcut; fix it or ticket it"
files:
  - crates/*/src/**/*.rs
ignores:
  - crates/*/src/**/tests.rs
  - crates/*/src/**/*_tests.rs
  - crates/*/src/**/test_*.rs
  - crates/*/src/**/tests/**
  - crates/hd_testkit/**
rule:
  kind: line_comment
  regex: '(?i)(for now|temporar|workaround|stopgap)'
  not:
    inside:
      stopBy: end
      matches: cfg-test-item
utils:
  cfg-test-item:
    any:
      - kind: mod_item
      - kind: function_item
      - kind: impl_item
    follows:
      stopBy:
        not:
          any:
            - kind: attribute_item
            - kind: line_comment
            - kind: block_comment
      kind: attribute_item
      regex: '^#\[(test|cfg\(test\))\]$'
