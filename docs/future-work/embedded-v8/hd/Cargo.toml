[package]
name = "hd-embedded-engine-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
v8-engine = ["dep:v8"]
wasmtime-engine = ["dep:wasmtime"]

[dependencies]
getrandom = "0.4"
v8 = { version = "=152.2.0", optional = true }
wasmtime = { version = "=49.0.2", default-features = false, features = ["cranelift", "incremental-cache", "pooling-allocator", "runtime", "std"], optional = true }

[[bin]]
name = "v8-probe"
path = "src/v8.rs"
required-features = ["v8-engine"]

[[bin]]
name = "wasmtime-probe"
path = "src/wasmtime.rs"
required-features = ["wasmtime-engine"]

[profile.dev]
opt-level = 1
