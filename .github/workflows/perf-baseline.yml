name: Record performance baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record one run
        run: |
          mkdir -p perf-run
          pnpm run perf:check --update \
            --baseline "perf-run/baseline-${{ matrix.run }}.json" \
            --json "perf-run/report-${{ matrix.run }}.json"

      - name: Upload run
        uses: actions/upload-artifact@v4
        with:
          name: inference-perf-run-${{ matrix.run }}
          path: perf-run/baseline-${{ matrix.run }}.json
          if-no-files-found: error

  merge:
    name: Merge p90
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download runs
        uses: actions/download-artifact@v4
        with:
          pattern: inference-perf-run-*
          path: perf-runs

      - name: Merge runs
        run: |
          mkdir -p perf-artifact
          pnpm run perf:check \
            --merge perf-runs/inference-perf-run-1/baseline-1.json \
            --merge perf-runs/inference-perf-run-2/baseline-2.json \
            --merge perf-runs/inference-perf-run-3/baseline-3.json \
            --merge perf-runs/inference-perf-run-4/baseline-4.json \
            --merge perf-runs/inference-perf-run-5/baseline-5.json \
            --percentile 90 \
            --baseline perf-artifact/baseline.json

      - name: Upload merged baseline
        uses: actions/upload-artifact@v4
        with:
          name: inference-perf-baseline
          path: perf-artifact/baseline.json
          if-no-files-found: error
