name: Test

on:
  push:
    # Agent branches (lane/**, claude/**, codex/**) run the full check too, so a branch is merged on a
    # green run instead of a local gate.
    branches: [main, "lane/**", "claude/**", "codex/**"]
    # Queue and log edits under docs/audit/ change no code, and pushing them often
    # would otherwise cancel every running check (cancel-in-progress below).
    paths-ignore:
      - "docs/audit/**"
  pull_request:
  # Windows and macOS twice a day, and on any commit that touches host code
  # (the host-scope job). Offset from the metrics run on the hour.
  schedule:
    - cron: "23 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request or an agent branch supersedes its running
# check, so a run never waits for runners behind a stale one. On main the
# running check always finishes, so frequent pushes can't leave main
# unchecked; only the queued run is replaced.
# Scheduled and manual runs get their own
# group: in the shared group a queued coverage run was replaced by the next
# push's run, and on 2026-11-13/14 three of them ended cancelled.
concurrency:
  group: test-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One release build per run. Every Rust command used to build the whole
  # workspace again in each of eight jobs, about 5.5 min each (run
  # 45113552161); now this job builds every test binary, the examples and
  # `hd` once, with all features, so CI covers the wasmtime engine that a
  # plain `cargo build` leaves out (crates/README.md). The other Linux jobs
  # download the build and only run it (scripts/ci-tests.sh). Paths stay
  # valid: every runner checks out to the same directory, which the test
  # binaries hold from `env!("CARGO_MANIFEST_DIR")`.
  #
  # The build restores third-party build output only (the workspace's own
  # crates and test binaries are not cached; they were most of a 7 GB cache).
  build:
    name: Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # hd_command's build script strips the Node host.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      # sccache caches each workspace crate's compiled output, so a run
      # rebuilds only the crates a change touches (and those above them).
      # rust-cache keeps third-party crates; the workspace's own were left
      # out of it, so every job rebuilt all of them (7.5 min, 2026-11-23).
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Use it only once its server is up: on Windows it once timed out
      # starting, and then every compile failed (run 45182764260).
      - name: Use sccache
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; building without it"
          fi

      # The scale check and the count budgets measure their own builds: the
      # scale check the `hd` that ships, and the counts hd_driver alone, without
      # the `checked-report` that hd_command and the tests turn on, which
      # changes plain builds too (count_ops: int-loop.hd's no-op calls 0 -> 9,
      # runs 45194113785 and 45198757197). Each is its own cargo run, so
      # features do not unify across them, and they are kept in target/tools
      # (the test build writes target/release/hd again). The `hd` has the
      # planted quadratic loop, off unless HD_PLANT_QUADRATIC is set.
      #
      # `cargo test --no-run` also builds every example and binary. The list
      # of test binaries (package directory, target, executable) goes with
      # them, for scripts/ci-tests.sh.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/tools
          cargo build --release -p hd_command --features plant-quadratic
          cp target/release/hd target/tools/
          cargo build --release -p hd_driver --example count_ops
          cp target/release/examples/count_ops target/tools/
          cargo test --release --all-features --workspace --no-run --message-format=json-render-diagnostics > target/ci-build.json
          jq -r --arg root "$PWD/" 'select(.reason == "compiler-artifact" and .executable != null)
            | [(.manifest_path | ltrimstr($root) | rtrimstr("/Cargo.toml")), .target.name,
               (.executable | ltrimstr($root)), .profile.test] | @tsv' target/ci-build.json > target/ci-build.tsv
          awk -F'\t' -v OFS='\t' '$4 == "true" { print $1, $2, $3 }' target/ci-build.tsv > target/ci-tests.tsv
          { cut -f3 target/ci-build.tsv | sort -u; echo target/ci-tests.tsv; echo target/tools; } > target/ci-files.txt
          tar -cf - -T target/ci-files.txt | zstd -T0 -3 -q -o target/ci-build.tar.zst
          echo "$(wc -l < target/ci-tests.tsv) test binaries, $(du -h target/ci-build.tar.zst | cut -f1) packed"

      - name: Store the build
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: target/ci-build.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      # Doc tests compile at test time, against the libraries just built.
      - name: Doc tests
        run: cargo test --release --all-features --workspace --doc

  # Format, lint, the web build, the specification, the scale check and the
  # count budgets share one setup. Each check runs whatever an earlier one
  # did, so one failure hides no other, and any failure fails the job. The
  # scale check and the counts run the Build job's tools.
  checks:
    name: Checks
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      budgets: ${{ steps.budgets.outcome }}
    steps:
      # The budget steps read the budgets of an earlier commit.
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch the build
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: target

      - name: Unpack the build
        run: zstd -dc target/ci-build.tar.zst | tar -xf -

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      # sccache caches each workspace crate's compiled output, so a run
      # rebuilds only the crates a change touches (and those above them).
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Use it only once its server is up: on Windows it once timed out
      # starting, and then every compile failed (run 45182764260).
      - name: Use sccache
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; building without it"
          fi

      - name: Install browser target
        run: rustup target add wasm32-unknown-unknown

      # check:cost runs one `ast-grep scan` (.ast-grep/sgconfig.yml, .ast-grep/rules/).
      - name: Install ast-grep
        shell: bash
        run: |
          set -euo pipefail
          # GitHub release downloads returned 504 for every attempt on 2026-11-09, so the
          # npm registry's copy of the same 0.50.0 binary is the fallback. Both are pinned.
          zip="$RUNNER_TEMP/ast-grep.zip"
          tgz="$RUNNER_TEMP/ast-grep.tgz"
          mkdir -p "$RUNNER_TEMP/ast-grep"
          if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$zip" https://github.com/ast-grep/ast-grep/releases/download/0.50.0/app-x86_64-unknown-linux-gnu.zip; then
            echo "0fd3f489639abb8465a914b74b8779171577582318d8a940d00399f59dba81c5  $zip" | sha256sum -c -
            unzip -q -o -d "$RUNNER_TEMP/ast-grep" "$zip"
          else
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$tgz" https://registry.npmjs.org/@ast-grep/cli-linux-x64-gnu/-/cli-linux-x64-gnu-0.50.0.tgz
            echo "c2d5154f158512e331de68b0e2ab155a8acd9fc0045177728b0ebabcd5f27512  $tgz" | sha256sum -c -
            tar -xzf "$tgz" -C "$RUNNER_TEMP/ast-grep"
          fi
          bin="$(find "$RUNNER_TEMP/ast-grep" -type f -name ast-grep | head -n 1)"
          chmod +x "$bin"
          dirname "$bin" >> "$GITHUB_PATH"

      - name: Ast-grep rule regressions
        if: ${{ !cancelled() }}
        run: ast-grep test --config .ast-grep/sgconfig.yml

      # Output-quality checks on the pushed change only (owner, 2026-11-08: "make it only
      # check the changed case, do not run full check"): no added `unsupported`, no
      # unreasoned shortcut, a stated cost, a test with each fix, a .wat for new programs.
      # The base is the push's `before` on main, else the merge base with main.
      - name: Change quality
        if: ${{ !cancelled() }}
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$REF" = refs/heads/main ] && [[ ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git merge-base HEAD origin/main)"
          fi
          node scripts/check-change.ts "$base" HEAD

      # Each check runs under its time budget (scripts/check-budgets.tsv).
      - name: Lint and format JS/TS
        if: ${{ !cancelled() }}
        run: |
          pnpm exec oxlint .
          pnpm run -s format:check
          for check in types host-sources spec-sync cost typescript-sources; do
            node scripts/check-budget.ts "check:$check" -- pnpm run -s "check:$check"
          done

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build browser-safe crates
        if: ${{ !cancelled() }}
        run: cargo build -p hd_syntax -p hd_web --target wasm32-unknown-unknown

      # LTO build, then compile and run a fixture through
      # the exports, with the size gate (crates/hd_web/DESIGN.md §7, W3).
      - name: Web compiler smoke test and size gate
        if: ${{ !cancelled() }}
        run: pnpm run -s test:web-compiler

      # The specification's own check. It runs no compiler: the spec and doc examples
      # are checked by the conformance test binary in the Rust tests job.
      # It runs before the budget steps, which rewrite files on main.
      # It runs under its time budget (scripts/check-budgets.tsv).
      - name: Spec check
        if: ${{ !cancelled() }}
        run: node scripts/check-budget.ts spec/check.sh -- bash spec/check.sh

      # The generated scale check (#1880, bench/metrics/scripts/scale.ts): its
      # own correct programs, holding every syntax node kind, at n and 4n,
      # judged by the compiler's deterministic work counters.
      - name: Scale check
        if: ${{ !cancelled() }}
        run: pnpm run metrics -- --hd target/tools/hd --only scale

      # Its self-test: the same `hd` with its planted quadratic loop turned
      # on. The check must fail, naming the counter that grew.
      - name: A planted quadratic loop fails the scale check
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          HD_PLANT_QUADRATIC=1 HD_SCALE_SHAPES=fn-items pnpm run metrics -- --hd target/tools/hd --only scale > planted.log 2>&1 || status=$?
          cat planted.log
          test "$status" -eq 1
          grep -q "FAIL scale: fn-items check: .*hashes" planted.log

      - name: Test count comparator
        id: comparator
        if: ${{ !cancelled() }}
        run: node --test bench/counts/baseline.test.ts bench/counts/conservative-baseline.test.ts

      - name: Read previous budget
        id: previous
        if: ${{ !cancelled() }}
        shell: bash
        env:
          COUNT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p target/count-ops
          count_base="$COUNT_BASE"
          if [ -z "$count_base" ] || [[ "$count_base" =~ ^0+$ ]]; then
            count_base="$(git merge-base HEAD origin/main)"
          fi
          if git cat-file -e "$count_base:bench/counts/baseline.json" 2>/dev/null; then
            git show "$count_base:bench/counts/baseline.json" > target/count-ops/previous.json
          fi
          if git cat-file -e "$count_base:bench/counts/conservative-sites.json" 2>/dev/null; then
            git show "$count_base:bench/counts/conservative-sites.json" > target/count-ops/previous-conservative.json
          fi

      - name: Compile benchmarks and enforce conservative sites by reason
        id: sites
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          site_flags=()
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            site_flags+=(--refresh)
          fi
          runner="$(awk -F'\t' '$1 == "crates/hd_driver" && $2 == "count_reasons" { print $3 }' target/ci-tests.tsv)"
          node bench/counts/conservative-sites.ts --runner "$runner" --previous target/count-ops/previous-conservative.json "${site_flags[@]}"

      - name: Measure and enforce per-program totals
        id: totals
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HD_CACHE: target/count-ops/cache
        run: |
          set -euo pipefail
          count_flags=(--no-cache)
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            count_flags+=(--refresh)
          fi
          node bench/counts/run.ts --compiler target/tools/count_ops --previous target/count-ops/previous.json "${count_flags[@]}"

      - name: Show measured counts
        if: always()
        shell: bash
        run: |
          if [ -f target/count-ops/summary.md ]; then
            cat target/count-ops/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/conservative-sites/summary.md ]; then
            cat target/conservative-sites/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Store measured counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-operations
          path: |
            target/count-ops/actual.json
            target/count-ops/summary.md
            target/conservative-sites/actual.json
            target/conservative-sites/summary.md
            target/conservative-sites/build.log
            target/conservative-sites/reports/*.tsv
          if-no-files-found: ignore

      # The budgets this run refreshed, for the job that commits them. A failure
      # in a check that isn't about budgets doesn't hold them back.
      - name: Store refreshed budgets
        id: budgets
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push'
          && steps.comparator.outcome == 'success' && steps.previous.outcome == 'success'
          && steps.sites.outcome == 'success' && steps.totals.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-budgets
          path: |
            bench/counts/baseline.json
            bench/counts/conservative-sites.json
          if-no-files-found: error

      # The Build job's binaries are not this job's to cache.
      - name: Keep the build out of the Rust cache
        if: always()
        run: rm -rf target/release target/tools

  # Only this job holds a write token, and it runs nothing from the repository.
  refresh-budgets:
    name: Refresh ownership count budgets
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.budgets == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Fetch refreshed budgets
        uses: actions/download-artifact@v4
        with:
          name: refreshed-budgets
          path: bench/counts

      - name: Refresh main's lower baseline
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bench/counts/baseline.json bench/counts/conservative-sites.json; then
            exit 0
          fi
          count_source="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$count_source" ]; then
            echo "Newer main owns the next baseline refresh."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bench/counts/baseline.json bench/counts/conservative-sites.json
          git commit -m "Refresh ownership count budgets"
          if ! git push origin HEAD:main; then
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$count_source" ]; then
              echo "Main advanced during refresh; the newer run will update it."
              exit 0
            fi
            exit 1
          fi

  # CI tests in release for speed (owner, 2026-10-11: dev took 26 min,
  # release 6). Local gates stay in the dev profile, where debug
  # assertions and overflow checks are on.
  #
  # Two jobs run the Build job's test binaries side by side: hd_command's,
  # and every other crate's. Conformance's suite runs in its own jobs below.
  test:
    name: Rust tests (${{ matrix.shard }})
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cli
            invert: ""
          - shard: workspace
            invert: "-v"
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Fetch the build
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: target

      - name: Unpack the build
        run: zstd -dc target/ci-build.tar.zst | tar -xf -

      - name: Test
        run: scripts/ci-tests.sh ${{ matrix.invert }} '^crates/hd_command/' --skip specification_conformance_passes_except_known_failures

  # `cargo install hd-lang` builds the published packages, and a package
  # holds only its own directory (crates/README.md, "Publishing"). The dry
  # run packages every published crate, builds each package against the
  # others' packages, and runs the packaged `hd` with no Node on PATH, so a
  # crate that starts to read outside its directory fails here, not at the
  # next release.
  package:
    name: Crate packages
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Stages the Node host as plain JavaScript (scripts/ship-host.ts).
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      # No Rust cache: the script builds from nothing in its own cargo home,
      # because cargo would reuse an earlier run's packages of the same
      # version (scripts/publish-crates.ts, `cargoHome`). sccache is safe
      # there: it keys each compile by its inputs' contents, and the cargo
      # home's path is the same every run.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Use it only once its server is up: on Windows it once timed out
      # starting, and then every compile failed (run 45182764260).
      - name: Use sccache
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; building without it"
          fi

      - name: Package and verify the crates
        run: node scripts/publish-crates.ts

  # Whether this commit runs the Windows and macOS jobs. They run on host code here,
  # and on everything twice a day, so a compiler or std change that breaks only on
  # those systems (paths, line endings) shows up within about 12 hours (owner 2026-11-07).
  host-scope:
    name: Host scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != push ] && [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$REF" = refs/heads/main ] && [[ ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git merge-base HEAD origin/main)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(crates/hd_cache/|crates/hd_run_wasmtime/|crates/hd_run/|crates/hd_command/|host/|\.github/|Cargo\.lock$|Cargo\.toml$|rust-toolchain)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The wasmtime host and disk cache depend on OS behavior (process
  # groups, Job objects, pipes and file locks), so their crates are also
  # checked and tested on Windows and macOS. Linux is covered above.
  #
  # One job per system, and one feature set, the shipped one (`dist`), so
  # every crate builds once. Run 45186991942 split Windows in two jobs and
  # built with three feature sets (`wasmtime` for the CLI, `dist` for its
  # conformance cases, none for the wasmtime host's tests): 470 s of
  # Windows' 765 and 263 s of its other job were builds.
  hosts:
    name: Host crates on ${{ matrix.os }}
    needs: host-scope
    if: needs.host-scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The parity tests compare with the Node host.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      # sccache caches each workspace crate's compiled output, so a run
      # rebuilds only the crates a change touches (and those above them).
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Use it only once its server is up: on Windows it once timed out
      # starting, and then every compile failed (run 45182764260).
      - name: Use sccache
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; building without it"
          fi

      - name: Lint host crates
        run: cargo clippy -p hd_run_wasmtime -p hd_command --features hd_command/dist --all-targets -- -D warnings

      # The disk cache's file locks and rejected-query handoff, the wasmtime
      # host (whose process parity tests run the release `hd` this builds),
      # and the CLI with its conformance cases, in one cargo run.
      # --no-fail-fast: one run reports every failing test binary.
      - name: Test
        run: cargo test --release --no-fail-fast --features hd_command/dist -p hd_cache -p hd_run_wasmtime -p hd_command

  # Split from the tests so the longest suite overlaps with the rest. Each
  # mode runs the Build job's conformance binary.
  conformance:
    name: Driver conformance (${{ matrix.mode }})
    needs: build
    env:
      HD_VERIFY: "1"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Four runs, no repeats (2026-11-23):
        # - Parse and type cases (4,533 of 8,875) only check, so their verdict
        #   is the same in every mode. Only `node and wasmtime` runs them; the
        #   others run the runtime cases (HD_CONFORMANCE_PHASE=runtime).
        # - `node and wasmtime` runs every case on Node too, so there is no
        #   separate Node-only run.
        include:
          # Every engine: each runs a build tuned for its own target and the
          # outputs are compared (crates/hd_opt/DESIGN.md (optimization
          # pipelines) §5, Q3). Local runs test the V8 target on Node only.
          - mode: node and wasmtime
            engine: wasmtime
            pipeline: ""
            checked: ""
            phase: ""
          # The checked run is the count audit, leak report and buffer traps, so
          # an ownership bug fails CI instead of a local run.
          - mode: checked
            engine: ""
            pipeline: ""
            checked: "1"
            phase: runtime
          # Every runtime fixture also runs through the optimized pipeline on
          # both engines, so a miscompile in an optimization pass fails CI
          # (docs/compiler/tiering.md §4.3).
          - mode: optimized
            engine: wasmtime
            pipeline: optimized
            checked: ""
            phase: runtime
          # The optimized pipeline with the checked runtime. An optimization that
          # removes a uniqueness check trips an assert here, even when the program's
          # output happens to stay right in plain optimized.
          - mode: checked optimized
            engine: ""
            pipeline: optimized
            checked: "1"
            phase: runtime
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Fetch the build
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: target

      - name: Unpack the build
        run: zstd -dc target/ci-build.tar.zst | tar -xf -

      # Only the suite that depends on the engine and the pipeline: the
      # binary's other tests (the formatter pass over every fixture, the std
      # runtime modules, the spec and doc examples, the harness's own) run
      # once, in the Rust tests job.
      - name: Conformance
        env:
          HD_CONFORMANCE_ENGINE: ${{ matrix.engine }}
          HD_CONFORMANCE_PIPELINE: ${{ matrix.pipeline }}
          HD_CONFORMANCE_CHECKED: ${{ matrix.checked }}
          HD_CONFORMANCE_PHASE: ${{ matrix.phase }}
        run: scripts/ci-tests.sh '^crates/hd_driver/conformance$' --exact specification_conformance_passes_except_known_failures

      # Runs std's runtime modules with the checked runtime's asserts too; the
      # Rust tests job runs them plain.
      - name: Std runtime modules (checked)
        if: ${{ !cancelled() && matrix.mode == 'checked' }}
        env:
          HD_CONFORMANCE_CHECKED: "1"
        run: scripts/ci-tests.sh '^crates/hd_driver/conformance$' --exact std_runtime_modules_pass_their_hd_tests_on_the_linear_backend
