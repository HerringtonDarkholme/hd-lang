name: Test

on:
  push:
    branches: [main]
    # Queue and log edits under docs/audit/ change no code, and pushing them often
    # would otherwise cancel every running check (cancel-in-progress below).
    paths-ignore:
      - "docs/audit/**"
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its running check. On main the
# running check always finishes, so frequent pushes can't leave main
# unchecked; only the queued run is replaced by a newer push.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every Rust command builds the whole workspace with all features, so CI
  # covers the wasmtime engine that a plain `cargo build` leaves out (the
  # `wasmtime` feature is off by default; crates/README.md).
  #
  # The Rust jobs run side by side, so the check takes as long as the
  # slowest one. Each restores third-party build output only (the
  # workspace's own crates and test binaries are not cached; they were
  # most of a 7 GB cache).
  lint:
    name: Rust format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The web compiler smoke test runs on Node.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install browser target
        run: rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build browser-safe crates
        run: cargo build -p hd_syntax -p hd_web --target wasm32-unknown-unknown

      # LTO build, then compile and run a fixture through
      # the exports, with the size gate (crates/hd_web/DESIGN.md §7, W3).
      - name: Web compiler smoke test and size gate
        run: pnpm run -s test:web-compiler

  # CI tests in release for speed (owner, 2026-10-11: dev took 26 min,
  # release 6). Local gates stay in the dev profile, where debug
  # assertions and overflow checks are on.
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Build release compiler
        run: cargo build --release --workspace --all-features --bin hd

      - name: Test
        run: cargo test --release --workspace --all-features -- --skip specification_conformance_passes_except_known_failures

  # The wasmtime host has code per operating system (process groups, Job
  # objects, pipes), so its crates are also checked and tested on Windows
  # and macOS. Linux is covered by the jobs above.
  hosts:
    name: Host crates on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The parity tests compare with the Node host.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Lint host crates
        run: cargo clippy -p hd_run_wasmtime -p hd_cli --features hd_cli/wasmtime --all-targets -- -D warnings

      - name: Test host crates
        # --no-fail-fast: one run reports every failing test binary, not
        # just the first.
        run: cargo test --release --no-fail-fast -p hd_run_wasmtime -p hd_cli --features hd_cli/wasmtime

  # Split from the tests so the longest suite overlaps with the rest.
  conformance:
    name: Driver conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      - name: New compiler conformance gate
        run: cargo test --release --workspace --all-features --test conformance

      # Every engine: each runs a build tuned for its own target and the
      # outputs are compared (crates/hd_opt/DESIGN.md (optimization pipelines) §5, Q3). Local runs test the
      # V8 target on Node only.
      - name: Conformance on Node and wasmtime
        env:
          HD_CONFORMANCE_ENGINE: wasmtime
        run: cargo test --release --workspace --all-features --test conformance

  # The specification's own check. It drives the Rust hd through
  # scripts/hd-conformance.sh, which builds it in the dev profile.
  spec:
    name: Specification check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Spec check
        run: bash spec/check.sh
