name: Test

on:
  push:
    # Agent branches (lane/**, claude/**, codex/**) run the full check too, so a branch is merged on a
    # green run instead of a local gate.
    branches: [main, "lane/**", "claude/**", "codex/**"]
    # Queue and log edits under docs/audit/ change no code, and pushing them often
    # would otherwise cancel every running check (cancel-in-progress below).
    paths-ignore:
      - "docs/audit/**"
  pull_request:
  # Windows and macOS twice a day, and on any commit that touches host code
  # (the host-scope job). Offset from the metrics run on the hour.
  schedule:
    - cron: "23 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request or an agent branch supersedes its running
# check, so a run never waits for runners behind a stale one. On main the
# running check always finishes, so frequent pushes can't leave main
# unchecked; only the queued run is replaced.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every Rust command builds the whole workspace with all features, so CI
  # covers the wasmtime engine that a plain `cargo build` leaves out (the
  # `wasmtime` feature is off by default; crates/README.md).
  #
  # The Rust jobs run side by side, so the check takes as long as the
  # slowest one. Each restores third-party build output only (the
  # workspace's own crates and test binaries are not cached; they were
  # most of a 7 GB cache).
  #
  # Format, lint, the web build, the specification and the count budgets share
  # one setup. Each check runs whatever an earlier one did, so one failure hides
  # no other, and any failure fails the job.
  checks:
    name: Checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      budgets: ${{ steps.budgets.outcome }}
    steps:
      # The budget steps read the budgets of an earlier commit.
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install browser target
        run: rustup target add wasm32-unknown-unknown

      - name: Lint and format JS/TS
        if: ${{ !cancelled() }}
        run: |
          pnpm exec oxlint .
          pnpm run -s format:check

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build browser-safe crates
        if: ${{ !cancelled() }}
        run: cargo build -p hd_syntax -p hd_web --target wasm32-unknown-unknown

      # LTO build, then compile and run a fixture through
      # the exports, with the size gate (crates/hd_web/DESIGN.md §7, W3).
      - name: Web compiler smoke test and size gate
        if: ${{ !cancelled() }}
        run: pnpm run -s test:web-compiler

      # The specification's own check. It parses through scripts/hd-conformance.sh,
      # in the dev profile. It runs before the budget steps, which rewrite files on main.
      - name: Spec check
        if: ${{ !cancelled() }}
        run: bash spec/check.sh

      - name: Build count compiler
        if: ${{ !cancelled() }}
        run: cargo build -p hd_driver --example count_ops

      - name: Test count comparator
        id: comparator
        if: ${{ !cancelled() }}
        run: node --test bench/counts/baseline.test.ts bench/counts/conservative-baseline.test.ts

      - name: Read previous budget
        id: previous
        if: ${{ !cancelled() }}
        shell: bash
        env:
          COUNT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p target/count-ops
          count_base="$COUNT_BASE"
          if [ -z "$count_base" ] || [[ "$count_base" =~ ^0+$ ]]; then
            count_base="$(git merge-base HEAD origin/main)"
          fi
          if git cat-file -e "$count_base:bench/counts/baseline.json" 2>/dev/null; then
            git show "$count_base:bench/counts/baseline.json" > target/count-ops/previous.json
          fi
          if git cat-file -e "$count_base:bench/counts/conservative-sites.json" 2>/dev/null; then
            git show "$count_base:bench/counts/conservative-sites.json" > target/count-ops/previous-conservative.json
          fi

      - name: Compile benchmarks and enforce conservative sites by reason
        id: sites
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          site_flags=()
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            site_flags+=(--refresh)
          fi
          node bench/counts/conservative-sites.ts --previous target/count-ops/previous-conservative.json "${site_flags[@]}"

      - name: Measure and enforce per-program totals
        id: totals
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HD_CACHE: target/count-ops/cache
        run: |
          set -euo pipefail
          count_flags=(--no-cache)
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            count_flags+=(--refresh)
          fi
          node bench/counts/run.ts --previous target/count-ops/previous.json "${count_flags[@]}"

      - name: Show measured counts
        if: always()
        shell: bash
        run: |
          if [ -f target/count-ops/summary.md ]; then
            cat target/count-ops/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/conservative-sites/summary.md ]; then
            cat target/conservative-sites/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Store measured counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-operations
          path: |
            target/count-ops/actual.json
            target/count-ops/summary.md
            target/conservative-sites/actual.json
            target/conservative-sites/summary.md
            target/conservative-sites/build.log
            target/conservative-sites/reports/*.tsv
          if-no-files-found: ignore

      # The budgets this run refreshed, for the job that commits them. A failure
      # in a check that isn't about budgets doesn't hold them back.
      - name: Store refreshed budgets
        id: budgets
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push'
          && steps.comparator.outcome == 'success' && steps.previous.outcome == 'success'
          && steps.sites.outcome == 'success' && steps.totals.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-budgets
          path: |
            bench/counts/baseline.json
            bench/counts/conservative-sites.json
          if-no-files-found: error

  # Only this job holds a write token, and it runs nothing from the repository.
  refresh-budgets:
    name: Refresh ownership count budgets
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.budgets == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Fetch refreshed budgets
        uses: actions/download-artifact@v4
        with:
          name: refreshed-budgets
          path: bench/counts

      - name: Refresh main's lower baseline
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bench/counts/baseline.json bench/counts/conservative-sites.json; then
            exit 0
          fi
          count_source="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$count_source" ]; then
            echo "Newer main owns the next baseline refresh."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bench/counts/baseline.json bench/counts/conservative-sites.json
          git commit -m "Refresh ownership count budgets"
          if ! git push origin HEAD:main; then
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$count_source" ]; then
              echo "Main advanced during refresh; the newer run will update it."
              exit 0
            fi
            exit 1
          fi

  # CI tests in release for speed (owner, 2026-10-11: dev took 26 min,
  # release 6). Local gates stay in the dev profile, where debug
  # assertions and overflow checks are on.
  #
  # cargo test runs test binaries one after another, so the suite is split
  # into two shards that run side by side: hd_cli, and every other crate. The cli
  # shard's cargo test builds the release `hd` its tests run. On Linux nothing
  # in the other shard runs it.
  test:
    name: Rust tests (${{ matrix.shard }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cli
            args: -p hd_cli
          - shard: workspace
            args: --workspace --exclude hd_cli
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Test
        run: cargo test --release --all-features ${{ matrix.args }} -- --skip specification_conformance_passes_except_known_failures

  # Whether this commit runs the Windows and macOS jobs. They run on host code here,
  # and on everything twice a day, so a compiler or std change that breaks only on
  # those systems (paths, line endings) shows up within about 12 hours (owner 2026-11-07).
  host-scope:
    name: Host scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != push ] && [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$REF" = refs/heads/main ] && [[ ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git merge-base HEAD origin/main)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(crates/hd_run_wasmtime/|crates/hd_run/|crates/hd_cli/|host/|\.github/|Cargo\.lock$|Cargo\.toml$|rust-toolchain)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The wasmtime host has code per operating system (process groups, Job
  # objects, pipes), so its crates are also checked and tested on Windows
  # and macOS. Linux is covered by the jobs above.
  hosts:
    name: Host crates on ${{ matrix.os }} (${{ matrix.shard }})
    needs: host-scope
    if: needs.host-scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        # On Windows the CLI conformance cases are half the time, so they
        # run beside the rest of the host tests. macOS runners are the
        # scarcest, so macOS runs everything in one job.
        include:
          - os: windows-latest
            shard: cli conformance
          - os: windows-latest
            shard: rest
          - os: macos-latest
            shard: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The parity tests compare with the Node host.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      # A cache per shard: they build third-party crates with different features, and
      # one shared key holds only the features of the shard that saved it first.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.shard == 'cli conformance' && 'cli-conformance' || matrix.shard }}

      - name: Lint host crates
        if: matrix.shard != 'cli conformance'
        run: cargo clippy -p hd_run_wasmtime -p hd_cli --features hd_cli/wasmtime --all-targets -- -D warnings

      # --no-fail-fast: one run reports every failing test binary, not just
      # the first.
      - name: Test the CLI conformance cases
        if: matrix.shard != 'rest'
        run: cargo test --release --no-fail-fast --features hd_cli/wasmtime -p hd_cli --test cli_conformance

      # The wasmtime host's process parity tests run the release CLI.
      - name: Build the CLI
        if: matrix.shard != 'cli conformance'
        run: cargo build --release -p hd_cli --features hd_cli/wasmtime

      - name: Test the wasmtime host
        if: matrix.shard != 'cli conformance'
        run: cargo test --release --no-fail-fast -p hd_run_wasmtime

      - name: Test the CLI
        if: matrix.shard != 'cli conformance'
        run: cargo test --release --no-fail-fast --features hd_cli/wasmtime -p hd_cli --bins --test all

  # Split from the tests so the longest suite overlaps with the rest. Default and
  # checked runs share a binary, so they share a job; a mode that builds or runs on
  # something else has its own.
  conformance:
    name: Driver conformance (${{ matrix.mode }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The checked run is the count audit, leak report and buffer traps, so
          # an ownership bug fails CI instead of a local run.
          - mode: default and checked
            engine: ""
            pipeline: ""
          # Every engine: each runs a build tuned for its own target and the
          # outputs are compared (crates/hd_opt/DESIGN.md (optimization
          # pipelines) §5, Q3). Local runs test the V8 target on Node only.
          - mode: node and wasmtime
            engine: wasmtime
            pipeline: ""
          # Every runtime fixture also runs through the optimized pipeline on
          # both engines, so a miscompile in an optimization pass fails CI
          # (docs/compiler/tiering.md §4.3).
          - mode: optimized
            engine: wasmtime
            pipeline: optimized
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      # Only the suite that depends on the engine and the pipeline: the
      # binary's other tests (the formatter pass over every fixture, the std
      # runtime modules, the harness's own) run once, in the Rust tests job.
      # Each run fails the job by itself, and the first failing doesn't skip the second.
      - name: Conformance
        if: ${{ !cancelled() }}
        env:
          HD_CONFORMANCE_ENGINE: ${{ matrix.engine }}
          HD_CONFORMANCE_PIPELINE: ${{ matrix.pipeline }}
        run: cargo test --release --workspace --all-features --test conformance -- --exact specification_conformance_passes_except_known_failures

      - name: Conformance (checked)
        if: ${{ !cancelled() && matrix.mode == 'default and checked' }}
        env:
          HD_CONFORMANCE_CHECKED: "1"
        run: cargo test --release --workspace --all-features --test conformance -- --exact specification_conformance_passes_except_known_failures
