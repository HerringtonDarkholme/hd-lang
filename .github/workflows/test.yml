name: Test

on:
  push:
    branches: [main]
    # Queue and log edits under audit/ change no code, and pushing them often
    # would otherwise cancel every running check (cancel-in-progress below).
    paths-ignore:
      - "audit/**"
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its running check. On main the
# running check always finishes, so frequent pushes can't leave main
# unchecked; only the queued run is replaced by a newer push.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler:
    name: Rust compiler front end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('compiler/Cargo.lock', 'compiler/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install browser target
        run: rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Release tests reuse this binary for the hd_cli integration tests.
      - name: Build release compiler
        run: cargo build --release --bin hd

      - name: Test
        run: cargo test --release --workspace -- --skip specification_conformance_does_not_regress

      - name: New compiler conformance gate
        run: cargo test --release -p hd_driver --test conformance

      - name: Build browser-safe syntax crate
        run: cargo build -p hd_syntax --target wasm32-unknown-unknown

  check:
    name: Check (types, lint, format, tests, spec)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      # Not part of `pnpm run check`, which stays fast for local work.
      - name: Fuzz smoke
        run: pnpm run fuzz:smoke

  # Its own job, so it runs next to the check job and on a quieter machine.
  # test/perf/inference/README.md explains the rules and the baseline.
  perf:
    name: Type checker performance gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Performance gate
        run: pnpm run perf:check

  e2e:
    name: End-to-end (playground and website)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the site together with the playground it serves.
      - name: Build website
        run: pnpm run website:build

      # ubuntu runners ship Google Chrome at /usr/bin/google-chrome, which
      # website/playground/test/chrome.ts finds. The run covers the site and
      # then the playground.
      - name: Website and playground end-to-end
        run: pnpm run website:e2e
