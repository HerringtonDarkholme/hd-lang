name: Test

on:
  push:
    branches: [main]
    # Queue and log edits under audit/ change no code, and pushing them often
    # would otherwise cancel every running check (cancel-in-progress below).
    paths-ignore:
      - "audit/**"
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its running check. On main the
# running check always finishes, so frequent pushes can't leave main
# unchecked; only the queued run is replaced by a newer push.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler:
    name: Rust compiler front end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('compiler/Cargo.lock', 'compiler/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install browser target
        run: rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Release tests reuse this binary for the hd_cli integration tests.
      - name: Build release compiler
        run: cargo build --release --bin hd

      - name: Test
        run: cargo test --release --workspace -- --skip specification_conformance_does_not_regress

      - name: New compiler conformance gate
        run: cargo test --release -p hd_driver --test conformance

      - name: Build browser-safe syntax crate
        run: cargo build -p hd_syntax --target wasm32-unknown-unknown

  # The TypeScript prototype's checks (pnpm run check, its perf gate and
  # the playground end-to-end run) are off: the prototype is a frozen test
  # oracle and the Rust compiler is the product (owner, 2026-10-07). Only the
  # specification's own check stays.
  spec:
    name: Specification check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Spec check
        run: bash spec/check.sh
