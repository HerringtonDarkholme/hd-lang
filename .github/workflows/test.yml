name: Test

on:
  push:
    branches: [main]
    # Queue and log edits under audit/ change no code, and pushing them often
    # would otherwise cancel every running check (cancel-in-progress below).
    paths-ignore:
      - "audit/**"
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its running check. On main the
# running check always finishes, so frequent pushes can't leave main
# unchecked; only the queued run is replaced by a newer push.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Rust jobs run side by side, so the check takes as long as the
  # slowest one. Each restores third-party build output only (the
  # workspace's own crates and test binaries are not cached; they were
  # most of a 7 GB cache).
  lint:
    name: Rust format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: compiler

      - name: Install browser target
        run: rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build browser-safe syntax crate
        run: cargo build -p hd_syntax --target wasm32-unknown-unknown

  # CI tests in release for speed (owner, 2026-10-11: dev took 26 min,
  # release 6). Local gates stay in the dev profile, where debug
  # assertions and overflow checks are on.
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: compiler

      - name: Build release compiler
        run: cargo build --release --bin hd

      - name: Test
        run: cargo test --release --workspace -- --skip specification_conformance_does_not_regress

  # Split from the tests so the longest suite overlaps with the rest.
  conformance:
    name: Driver conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: compiler

      - name: New compiler conformance gate
        run: cargo test --release -p hd_driver --test conformance

  # The TypeScript prototype's checks (pnpm run check, its perf gate and
  # the playground end-to-end run) are off: the prototype is a frozen test
  # oracle and the Rust compiler is the product (owner, 2026-10-07). Only the
  # specification's own check stays.
  spec:
    name: Specification check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Spec check
        run: bash spec/check.sh
