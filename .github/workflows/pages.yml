name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  # Redeploy after each metrics run, so the Daily Metrics page shows it.
  workflow_run:
    workflows: ["Daily goal metrics"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run and Check in the playground compile with the Rust compiler's
      # wasm, which the UI tests and the website build need
      # (crates/hd_web/DESIGN.md §7, W5). Set up as test.yml's lint job does.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install browser target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the playground's compiler
        run: pnpm run -s build:web-compiler

      # The tour and learn-page checks run snippets through the Rust `hd`
      # (website/src/learn-check.ts), which test:ui and website:build use.
      - name: Build hd
        run: cargo build -p hd_cli

      # The website and playground tests gate the deploy; they are not
      # part of `pnpm run check`.
      - name: UI tests
        run: pnpm run test:ui

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # The Daily Metrics page renders the README on the metrics-data branch.
      - name: Fetch metrics
        run: |
          if git fetch --depth=1 origin metrics-data; then
            git show FETCH_HEAD:README.md > "$RUNNER_TEMP/metrics-README.md"
          fi

      # Builds the site and the playground it serves at playground/.
      - name: Build website
        run: pnpm run website:build
        env:
          METRICS_README: ${{ runner.temp }}/metrics-README.md
          # `/hd-lang` for the project site, empty for a custom domain.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
