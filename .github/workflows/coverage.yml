name: Coverage

# Core coverage on its own workflow, twice a day on main and by hand. It
# ran every 3 hours from 2026-11-16, but each run takes 46-75 minutes
# (about 8 runner-hours a day, half of it timed out), so it runs twice a day
# until #2342 cuts its time. Test's own schedule is also twice a day: it
# starts the Windows and macOS host jobs. Coverage stays off push runs:
# three instrumented conformance runs are too slow for every push.
on:
  schedule:
    - cron: "53 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One run at a time; a newer one waits instead of cancelling the running one.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Core coverage
    runs-on: ubuntu-latest
    # Owner, 2026-11-24: Coverage is the scheduled-only exception to the
    # 10-minute job rule ("coverage is okay, it can be longer"). It runs about
    # 32 minutes since #2342 dropped checked conformance on a fast runner.
    # Runner speed is bimodal: on 2026-11-26 two runs on main ran every test
    # binary 3.4x slower (hd_driver all: 330 s -> 1,125 s) with no code or
    # config change, so 60 minutes cancelled them. 120 covers a slow runner.
    timeout-minutes: 120
    steps:
      # Full history maps the previous measured run's uncovered lines.
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      # Its own key and folder: instrumented builds share no artifacts with
      # the plain ones, and cargo-llvm-cov builds in target/llvm-cov-target.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: coverage
          workspaces: ". -> target/llvm-cov-target"

      - name: Install coverage tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.14

      - name: Measure and check
        env:
          GH_TOKEN: ${{ github.token }}
        # Redundant checked conformance is omitted using measured per-set coverage.
        # Per-set attribution remains available through scripts/coverage.ts --attribute.
        # The runner's cores and model, to tell a slow runner from a slow change.
        run: |
          echo "runner: $(nproc) cores, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          node scripts/coverage.ts --check

      - name: Store the report
        # Failed checks still become the next reference when a report exists.
        # Keep completed sets even when a later set hits the job timeout.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: |
            bench/coverage/report.json
            bench/coverage/summary.md
            bench/coverage/uncovered/
            target/coverage/lcov.info
            target/coverage/sets/
          if-no-files-found: ignore
