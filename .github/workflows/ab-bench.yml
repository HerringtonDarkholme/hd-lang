name: A/B bench

# Times bench programs under two compilers on one runner (#2369): `hd` is
# built at `base` and at `head`, and each program runs `runs` times per
# engine, base and head alternating (which goes first flips each round),
# so runner drift lands on both sides alike. Each program prints its own
# phase times (`push 209 index 369 ... check N`); the table holds each
# phase's median per side, head over base, and for each pair `a:b` in
# `pairs` the ratio of program `a` over program `b` under one compiler.
# The programs come from the dispatched ref's bench/ab (or any package
# path), so both compilers run the same source.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref (branch, tag or commit)
        required: true
        default: main
      head:
        description: Head ref (branch, tag or commit)
        required: true
      programs:
        description: Packages to run, names under bench/ab or paths
        required: true
        default: list-builtin list-plain map-builtin map-plain
      pairs:
        description: Program ratios to print, as a:b (a over b)
        required: false
        default: list-plain:list-builtin map-plain:map-builtin
      runs:
        description: Runs per program, engine and side
        required: true
        default: "15"

permissions:
  contents: read

concurrency:
  group: ab-bench-${{ github.run_id }}

jobs:
  ab:
    name: A/B
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ inputs.base }}
      HEAD: ${{ inputs.head }}
      PROGRAMS: ${{ inputs.programs }}
      PAIRS: ${{ inputs.pairs }}
      RUNS: ${{ inputs.runs }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The pinned Node: the `node` engine runs on it, and hd_command's
      # build script strips the Node host with it.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: ab-bench

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Use sccache
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; building without it"
          fi

      # The programs first, from the dispatched ref: each side gets its own
      # copy, so their build directories and caches never mix.
      - name: Copy the programs
        shell: bash
        run: |
          set -euo pipefail
          for side in base head; do
            mkdir -p "$RUNNER_TEMP/$side"
            for p in $PROGRAMS; do
              src=$p
              [ -d "$src" ] || src=bench/ab/$p
              test -f "$src/hd.toml" || { echo "::error::no package $p"; exit 1; }
              cp -R "$src" "$RUNNER_TEMP/$side/$(basename "$p")"
            done
          done

      # One target directory: the second build recompiles only the crates
      # the two refs differ in.
      - name: Build hd at base and head
        shell: bash
        run: |
          set -euo pipefail
          for side in base head; do
            ref=$BASE; [ "$side" = head ] && ref=$HEAD
            git checkout -q --detach "$(git rev-parse --verify "origin/$ref^{commit}" 2>/dev/null || git rev-parse --verify "$ref^{commit}")"
            echo "$side: $(git log -1 --format='%h %s')" | tee -a "$RUNNER_TEMP/refs.txt"
            start=$(date +%s)
            cargo build -q --release -p hd_command --features wasmtime
            echo "$side build: $(( $(date +%s) - start ))s"
            cp target/release/hd "$RUNNER_TEMP/hd-$side"
          done
          git checkout -q "$GITHUB_SHA"

      # Each program is built once per side and engine before any timing.
      - name: Run
        shell: bash
        run: |
          set -uo pipefail
          raw=$RUNNER_TEMP/raw.txt; : > "$raw"
          node --version
          for side in base head; do
            for p in $PROGRAMS; do
              for e in wasmtime node; do
                (cd "$RUNNER_TEMP/$side/$(basename "$p")" && HD_CACHE=$RUNNER_TEMP/cache-$side \
                  "$RUNNER_TEMP/hd-$side" build --release --engine $e > /dev/null) \
                  || echo "::warning::$p does not build at $side on $e"
              done
            done
          done
          start=$(date +%s)
          for r in $(seq 1 "$RUNS"); do
            order="base head"; [ $((r % 2)) = 0 ] && order="head base"
            for p in $PROGRAMS; do
              n=$(basename "$p")
              for e in wasmtime node; do
                for side in $order; do
                  out=$(cd "$RUNNER_TEMP/$side/$n" && HD_CACHE=$RUNNER_TEMP/cache-$side \
                    timeout 120 "$RUNNER_TEMP/hd-$side" run --release --engine $e 2>&1 | tr '\n' ' ')
                  echo "$e $side $n $r $out" >> "$raw"
                done
              done
            done
            echo "round $r done at $(( $(date +%s) - start ))s"
          done

      - name: Table
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/refs.txt"
          python3 -I - "$RUNNER_TEMP/raw.txt" "$PAIRS" > "$RUNNER_TEMP/table.md" <<'PY'
          import statistics, sys
          raw, pairs = sys.argv[1], sys.argv[2].split()
          times = {}  # (engine, side, program, phase) -> [ms]
          for line in open(raw):
              f = line.split()
              if len(f) < 4:
                  continue
              e, side, prog, rest = f[0], f[1], f[2], f[4:]
              for name, value in zip(rest[::2], rest[1::2]):
                  if name != "check" and value.lstrip("-").isdigit():
                      times.setdefault((e, side, prog, name), []).append(int(value))
          med = {k: statistics.median(v) for k, v in times.items()}
          def ratio(a, b):
              return f"{a / b:.3f}" if a is not None and b else "n/a"
          print("| engine | program | phase | base ms | head ms | head/base | runs |")
          print("|---|---|---|---:|---:|---:|---:|")
          rows = sorted({(e, p, n) for (e, _, p, n) in med})
          for e, p, n in rows:
              b, h = med.get((e, "base", p, n)), med.get((e, "head", p, n))
              runs = len(times.get((e, "head", p, n), times.get((e, "base", p, n), [])))
              print(f"| {e} | {p} | {n} | {b if b is not None else 'n/a'} | {h if h is not None else 'n/a'} | {ratio(h, b)} | {runs} |")
          if pairs:
              print()
              print("| engine | pair | phase | base ratio | head ratio |")
              print("|---|---|---|---:|---:|")
              for pair in pairs:
                  a, _, b = pair.partition(":")
                  phases = sorted({n for (e, _, p, n) in med if p == a})
                  for e in ("wasmtime", "node"):
                      for n in phases:
                          r = [ratio(med.get((e, s, a, n)), med.get((e, s, b, n))) for s in ("base", "head")]
                          print(f"| {e} | {a}/{b} | {n} | {r[0]} | {r[1]} |")
          PY
          cat "$RUNNER_TEMP/table.md" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -v ' check ' "$RUNNER_TEMP/raw.txt" | head -20 || true

      - name: Store the raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-bench
          path: |
            ${{ runner.temp }}/raw.txt
            ${{ runner.temp }}/table.md
            ${{ runner.temp }}/refs.txt
          retention-days: 14
          if-no-files-found: warn
