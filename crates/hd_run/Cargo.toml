[package]
name = "hd_run"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
include.workspace = true
description = "Engine-neutral program loading and run outcomes (hd compiler internals, no stable API; install `hd-lang`)"

[dependencies]
hd_base = { workspace = true }
hd_cache = { workspace = true }
hd_host_abi = { workspace = true }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = "=0.3.18"

[target.'cfg(windows)'.dependencies]
# Native image mappings require an executable file handle on Windows.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
ctrlc = "=3.5.2"
