[package]
name = "hd_run_wasmtime"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# `OptLevel`, which selects the engine options (`EngineConfig::pipeline`).
hd_base = { path = "../hd_base" }
# The compiled cache's private `clpack` entries (`code_cache.rs`).
hd_cache = { path = "../hd_cache", features = ["disk"] }
hd_host_abi = { path = "../hd_host_abi" }
hd_run = { path = "../hd_run" }
# Session inputs (`f1c55020:future-work/compiler/repl-plan.md` §2.3): the session module name and keys.
hd_wasm = { path = "../hd_wasm" }
# The path sandbox (`fs/sandbox.rs`): a granted directory is opened once
# and every file operation resolves under its handle (`cli.cap.scope.path`).
# `cap-fs-ext` adds the opens that do not follow a final symbolic link.
cap-fs-ext = { version = "=4.0.3", default-features = false, features = ["std"] }
cap-std = "=4.0.3"
getrandom = "0.4"
socket2 = "0.6"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde_json = "1"
# The `hd-io` runtime that offloaded host operations run on
# one current-thread runtime, so no `rt-multi-thread`; no `macros`,
# `signal` or `fs`.
tokio = { version = "=1.53.2", default-features = false, features = [
    "io-util",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }
# The engine of docs/compiler/engines-and-test-runner.md §18.1: Cranelift, Wasm GC with
# the copying collector, and nothing the CLI does not use (no component
# model, no async, no WASI). Pooling is selected only by the test engine.
# `incremental-cache` keeps compiled functions across runs (`code_cache.rs`).
wasmtime = { version = "=49.0.2", default-features = false, features = [
    "cranelift",
    "gc",
    "gc-copying",
    "incremental-cache",
    "pooling-allocator",
    "runtime",
    "std",
] }

[lints]
workspace = true

# No harness: the test must own every thread to choose which one may take
# SIGCHLD (#160).
[[test]]
name = "child_signals"
harness = false

[dev-dependencies]
# Reads a stream's keep-alive idle time back in tests (`tcp_keepalive_time`).
socket2 = { version = "0.6", features = ["all"] }
# Errno constants in tests.
wasm-encoder = "=0.258.3"
# Session-link tests (`f1c55020:future-work/compiler/repl-plan.md` C1) link modules with hd_wasm and run them here;
# session-collection tests (C2) build them with hd_driver.
hd_driver = { path = "../hd_driver", default-features = false }
hd_mono = { path = "../hd_mono" }
hd_project = { path = "../hd_project" }
hd_sched = { path = "../hd_sched" }

[target.'cfg(windows)'.dependencies]
# `Process.run!` puts each child in a Job object that kills the child and
# its descendants when it closes (`std-process.cancel`), as a process
# group kill does on Unix (owner decision, #160).
win32job = "=2.0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
# No safe std call reads the host name on Windows.
hostname = "0.4"

[target.'cfg(unix)'.dependencies]
# Wasmtime's initial Unix mmap allocation reports this concrete errno type;
# `process` kills a child's process group (`core/process.rs`); `system`
# reads the host name for `Sys.hostname` (`core/sys.rs`); `fs` makes FIFOs
# and reads descriptor flags in tests.
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "process", "std", "system"] }

[target.'cfg(unix)'.dev-dependencies]
# Only `tests/child_signals.rs`: rustix has no thread signal mask.
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
