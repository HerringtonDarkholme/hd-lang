[package]
name = "hd_web"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# cdylib is the playground's compiler wasm (`--profile web`); rlib keeps
# the crate usable from tests and other crates.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hd_base = { path = "../hd_base" }
hd_cache = { path = "../hd_cache" }
hd_diag = { path = "../hd_diag" }
hd_project = { path = "../hd_project" }
hd_sched = { path = "../hd_sched" }
hd_driver = { path = "../hd_driver", default-features = false }
# Prints the compiled module for the WAT goal; the same wasm-tools line as
# hd_wasm's wasm-encoder.
wasmprinter = { version = "0.261.0", default-features = false }

[lints]
workspace = true
