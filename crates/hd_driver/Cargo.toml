[package]
name = "hd_driver"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The one driver: the task graph of one compile run over the caller's sources, cache store, executor and clock"

[features]
# Lets `Executor::Pool` run the graph on a rayon thread pool. Without it the
# driver is serial only, which is what the browser build uses.
threads = ["hd_sched/threads"]
# `analysis` and `checked-report` are default too: hd_cli and hd_lint turn them
# on, and a default without them made every native workspace command that
# reached hd_cli compile hd_driver (and hd_wasm) a second time. The browser
# build uses default-features = false and keeps both off.
default = ["threads", "fixtures", "host-artifacts", "checked-builds", "checked-report", "analysis"]
# Stage fixtures render TIR, inspect layouts and root non-executable declarations.
# Browser clients only build programs/tests/REPL inputs and leave this off.
fixtures = []
# Native callers consume generated host JS; browser clients execute imports
# through their own host and do not return generated glue.
host-artifacts = []
# Checked builds (`Packages::checked`, `Packages::verify_own`): the
# allocation/count-audit runtime and the ownership verifier. Browser clients
# never request them and leave this off.
checked-builds = []
checked-report = ["checked-builds", "hd_wasm/checked-report"]
# Lets a client attach one post-verification analysis consumer, with its
# findings cache (`src/analysis.rs`). The web compiler keeps this feature off
# and builds `src/analysis_off.rs`, whose hooks do nothing.
analysis = []
# Runs the tests that compare against the wasmtime engine. A dev-dependency
# cannot be optional, so the test-only `hd_run_wasmtime` is an optional
# dependency; the library itself never uses it.
wasmtime = ["dep:hd_run_wasmtime"]

[dependencies]
hd_base = { path = "../hd_base" }
hd_cache = { path = "../hd_cache" }
hd_check = { path = "../hd_check" }
hd_diag = { path = "../hd_diag" }
hd_host_abi = { path = "../hd_host_abi" }
hd_intern = { path = "../hd_intern" }
hd_mono = { path = "../hd_mono" }
hd_opt = { path = "../hd_opt" }
hd_project = { path = "../hd_project" }
hd_resolve = { path = "../hd_resolve" }
hd_run_wasmtime = { path = "../hd_run_wasmtime", optional = true }
hd_sched = { path = "../hd_sched" }
hd_structure = { path = "../hd_structure" }
hd_syntax = { path = "../hd_syntax" }
hd_tir = { path = "../hd_tir" }
hd_types = { path = "../hd_types" }
hd_wasm = { path = "../hd_wasm" }

[build-dependencies]
hd_base = { path = "../hd_base" }
hd_syntax = { path = "../hd_syntax" }

[lints]
workspace = true

[dev-dependencies]
hd_fmt = { path = "../hd_fmt" }
hd_run = { path = "../hd_run" }
hd_testkit = { path = "../hd_testkit" }
# Session-module tests (`f1c55020:future-work/compiler/repl-plan.md` C2) validate the modules a session
# builds and read their imports, exports and function names.
wasmparser = { version = "0.261.0", default-features = false, features = ["std", "validate", "features"] }
