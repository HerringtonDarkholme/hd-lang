[package]
name = "hd_lint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
include.workspace = true
description = "Read-only advice over checked source facts, behind `hd lint` (hd compiler internals, no stable API; install `hd-lang`)"

[dependencies]
hd_base = { workspace = true }
hd_check = { workspace = true }
hd_diag = { workspace = true }
hd_driver = { workspace = true, features = ["analysis"] }
hd_project = { workspace = true }
hd_resolve = { workspace = true }
hd_syntax = { workspace = true }
hd_types = { workspace = true }

[dev-dependencies]
hd_sched = { path = "../hd_sched" }
hd_cache = { path = "../hd_cache" }
hd_testkit = { path = "../hd_testkit" }

[lints]
workspace = true
