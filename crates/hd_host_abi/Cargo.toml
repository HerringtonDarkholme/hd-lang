[package]
name = "hd_host_abi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
include.workspace = true
description = "Host import and ABI descriptions (hd compiler internals, no stable API; install `hd-lang`)"

[dev-dependencies]
# Reads std's declarations for the ABI model (`tests/abi_model.rs`).
hd_syntax = { path = "../hd_syntax" }
# The pinned Node (`hd_testkit::node`) for the JavaScript adapter test.
hd_testkit = { path = "../hd_testkit" }

[lints]
workspace = true

[features]
# The Rust companion generator (`native_rust`): native CLI builds enable
# it; `hd_web` leaves it off so it never enters the web compiler.
native-rust = []

[dependencies]
# Contract integer encoding and the generator's fixed-seed hash maps.
hd_base = { workspace = true }
