[package]
name = "hd_cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hd"
path = "src/main.rs"

[features]
# The in-process wasmtime engine (`--engine wasmtime`). Off by default:
# wasmtime is most of a cold build, and Node is the default engine. The
# REPL runs on wasmtime only, so its parser check, line editor and Ctrl-C
# handler come with it.
wasmtime = ["dep:hd_run_wasmtime", "dep:rustyline"]

[dependencies]
hd_base = { path = "../hd_base" }
hd_cache = { path = "../hd_cache", features = ["disk"] }
hd_check = { path = "../hd_check" }
hd_deps = { path = "../hd_deps" }
hd_diag = { path = "../hd_diag" }
hd_doc = { path = "../hd_doc" }
hd_driver = { path = "../hd_driver", features = ["threads"] }
hd_fmt = { path = "../hd_fmt" }
hd_project = { path = "../hd_project" }
hd_run = { path = "../hd_run" }
hd_run_wasmtime = { path = "../hd_run_wasmtime", optional = true }
hd_sched = { path = "../hd_sched", features = ["threads"] }
hd_resolve = { path = "../hd_resolve" }
hd_syntax = { path = "../hd_syntax" }
# The REPL (`cli.repl.*`): the prompt's line editor with in-memory history,
# and SIGINT while an input runs, which stops it (`cli.repl.stop`).
ctrlc = "=3.5.2"
rustyline = { version = "=18.0.1", default-features = false, optional = true }

# Unix: an interrupt that `hd` hears (SIGINT or SIGTERM) is passed on to the
# Node engine's child as SIGUSR2 (`cli.cancel.forward`). Both crates have
# safe APIs for it; `hd_cli` stays free of `unsafe`.
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
signal-hook = "=0.3.18"

[lints]
workspace = true

[dev-dependencies]
hd_testkit = { path = "../hd_testkit" }
