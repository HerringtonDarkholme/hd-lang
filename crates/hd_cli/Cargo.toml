[package]
name = "hd_cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hd"
path = "src/main.rs"

[features]
# The in-process wasmtime engine (`--engine wasmtime`). Off by default:
# wasmtime is most of a cold build, and Node is the default engine.
wasmtime = ["dep:hd_run_wasmtime"]

[dependencies]
hd_cache = { path = "../hd_cache", features = ["disk"] }
hd_check = { path = "../hd_check" }
hd_deps = { path = "../hd_deps" }
hd_diag = { path = "../hd_diag" }
hd_doc = { path = "../hd_doc" }
hd_driver = { path = "../hd_driver", features = ["threads"] }
hd_fmt = { path = "../hd_fmt" }
hd_project = { path = "../hd_project" }
hd_run = { path = "../hd_run" }
hd_run_wasmtime = { path = "../hd_run_wasmtime", optional = true }
hd_sched = { path = "../hd_sched", features = ["threads"] }
tracking-allocator = { version = "=0.4.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
hd_testkit = { path = "../hd_testkit" }
