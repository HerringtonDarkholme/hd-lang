[package]
name = "hd_wasm_linear"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The linear-memory backend: reference-counted values in Wasm linear memory, emitted from TIR and collection output"

[features]
checked-report = []

[dependencies]
hd_base = { path = "../hd_base" }
hd_types = { path = "../hd_types" }
hd_tir = { path = "../hd_tir" }
hd_mono = { path = "../hd_mono" }
hd_host_abi = { path = "../hd_host_abi" }
wasm-encoder = { version = "0.261.0", default-features = false, features = ["std"] }

[dev-dependencies]
hd_testkit = { path = "../hd_testkit" }
wasmparser = { version = "0.261.0", default-features = false, features = ["std", "validate", "features"] }

[lints]
workspace = true
