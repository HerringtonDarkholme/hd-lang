[package]
name = "hd_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
include.workspace = true
description = "The linear-memory backend: reference-counted values in Wasm linear memory, emitted from TIR and collection output (hd compiler internals, no stable API; install `hd-lang`)"

[features]
checked-report = []
# The decision ledger (`src/ledger.rs`, `scripts/ledger.ts`): counts each
# emitter decision as it fires. Off in every shipped, web and test build.
ledger = []

[dependencies]
hd_base = { workspace = true }
hd_types = { workspace = true }
hd_tir = { workspace = true }
hd_opt = { workspace = true }
hd_mono = { workspace = true }
hd_layout = { workspace = true }
hd_host_abi = { workspace = true }
wasm-encoder = { version = "0.261.0", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
hashbrown = { version = "0.17.1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }

[dev-dependencies]
hd_testkit = { path = "../hd_testkit" }
wasmparser = { version = "0.261.0", default-features = false, features = ["std", "validate", "features"] }

[lints]
workspace = true
