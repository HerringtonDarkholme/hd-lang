[package]
name = "hd_command"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# `scripts/publish-crates.ts` stages `host/` into the package (`build.rs`).
include = ["/src/**", "/build.rs", "/host/**"]
description = "The `hd` command as a library: commands, disk sources and cache, the Node engine and the REPL (hd compiler internals, no stable API; install `hd-lang`)"

[[bin]]
name = "hd"
path = "src/main.rs"

[features]
# The in-process wasmtime engine (`--engine wasmtime`). Off by default:
# wasmtime is most of a cold build. The REPL runs on wasmtime only, so its parser check, line editor and Ctrl-C
# handler come with it.
wasmtime = ["dep:hd_run_wasmtime", "dep:rustyline"]
# The shipped binary (`--profile dist --features dist`). Developer and
# test builds, including optimized ones with only `wasmtime`, keep Node.
# Debug builds keep Node even when tooling enables every feature.
dist = ["wasmtime"]
# The generated scale check's self-test (#1880): a quadratic loop over the
# package's source lines, run only with `HD_WORK` set, which the check
# must flag (`src/work.rs`). Never in a shipped build.
plant-quadratic = []

[dependencies]
hd_base = { workspace = true }
hd_cache = { workspace = true, features = ["disk"] }
hd_check = { workspace = true }
hd_lint = { workspace = true }
hd_deps = { workspace = true }
hd_diag = { workspace = true }
hd_doc = { workspace = true }
hd_driver = { workspace = true, features = ["threads", "checked-report", "analysis"] }
hd_fmt = { workspace = true }
# `native-rust`: the Rust companion of `hd build --engine wasmtime`.
hd_host_abi = { workspace = true, features = ["native-rust"] }
hd_project = { workspace = true }
hd_run = { workspace = true }
hd_run_wasmtime = { workspace = true, optional = true }
hd_sched = { workspace = true, features = ["threads"] }
hd_resolve = { workspace = true }
hd_syntax = { workspace = true }
# The REPL (`cli.repl.*`): the prompt's line editor with in-memory history,
# and SIGINT while an input runs, which stops it (`cli.repl.stop`).
ctrlc = "=3.5.2"
# The global allocator under `work::Counting` (#1802 draft 07). Its `v2`
# C library, as uv pins it: v3.3.2 crashes on x86 CPUs without POPCNT.
mimalloc = { version = "=0.1.52", default-features = false, features = ["v2"] }
serde_json = "1"
# `HD_WAT`: the built module's text beside it, for `scripts/ir-audit.py`.
wasmparser = { version = "0.261.0", default-features = false, features = ["std"] }
wasmprinter = { version = "0.261.0", default-features = false }
sha2 = { version = "0.10", default-features = false }
rustyline = { version = "=18.0.1", default-features = false, optional = true }

# Unix: an interrupt that `hd` hears (SIGINT or SIGTERM) is passed on to the
# Node engine's child as SIGUSR2 (`cli.cancel.forward`). Both crates have
# safe APIs for it; `hd_command` stays free of `unsafe`.
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
signal-hook = "=0.3.18"

[target.'cfg(windows)'.dependencies]
# The Node engine's process helper owns its child's Job before it runs.
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object"] }
serde_json = "1"
tokio = { version = "=1.53.2", default-features = false, features = ["io-util", "process", "rt", "sync", "macros"] }

[lints]
workspace = true

[dev-dependencies]
hd_testkit = { path = "../hd_testkit" }
