[workspace]
members = ["crates/hd_base", "crates/hd_intern", "crates/hd_diag", "crates/hd_syntax", "crates/hd_fmt", "crates/hd_project", "crates/hd_types", "crates/hd_resolve", "crates/hd_tir", "crates/hd_structure", "crates/hd_check", "crates/hd_lint", "crates/hd_mono", "crates/hd_opt", "crates/hd_host_abi", "crates/hd_wasm_linear", "crates/hd_run", "crates/hd_run_wasmtime", "crates/hd_sched", "crates/hd_cache", "crates/hd_deps", "crates/hd_driver", "crates/hd_doc", "crates/hd_stdpack", "crates/hd_web", "crates/hd_wat", "crates/hd_testkit", "crates/hd_cli"]
# wasmtime and cranelift are most of a cold build, so plain `cargo build`,
# `cargo test` and `cargo clippy` leave `hd_run_wasmtime` out. `--workspace`
# or `--features wasmtime` brings it in (see crates/README.md, "Wasmtime Engine").
default-members = ["crates/hd_base", "crates/hd_intern", "crates/hd_diag", "crates/hd_syntax", "crates/hd_fmt", "crates/hd_project", "crates/hd_types", "crates/hd_resolve", "crates/hd_tir", "crates/hd_structure", "crates/hd_check", "crates/hd_lint", "crates/hd_mono", "crates/hd_opt", "crates/hd_host_abi", "crates/hd_wasm_linear", "crates/hd_run", "crates/hd_sched", "crates/hd_cache", "crates/hd_deps", "crates/hd_driver", "crates/hd_doc", "crates/hd_stdpack", "crates/hd_web", "crates/hd_wat", "crates/hd_testkit", "crates/hd_cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
implicit_hasher = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"

# Light optimization in dev keeps debug assertions and overflow checks on
# while tests run about as fast as release (local gate ~81 s against
# ~178 s at opt-level 0; owner, 2026-10-11, task #299).
[profile.dev]
opt-level = 1

# The playground's compiler wasm (scripts/build-web-compiler.js, which
# also compresses the linker's relocations). Only that build selects it
# (crates/hd_web/DESIGN.md §4). `opt-level = "s"`, not "z": "z" cut the
# gzip download by 167 KB but made compiles about 25% slower (cold 185 ->
# 230 ms, warm 3.4 -> 4.5 ms); the owner prefers compile speed (#49).
[profile.web]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
