[workspace]
members = ["crates/hd_base", "crates/hd_intern", "crates/hd_diag", "crates/hd_syntax", "crates/hd_fmt", "crates/hd_project", "crates/hd_types", "crates/hd_resolve", "crates/hd_tir", "crates/hd_structure", "crates/hd_check", "crates/hd_lint", "crates/hd_mono", "crates/hd_opt", "crates/hd_host_abi", "crates/hd_wasm", "crates/hd_run", "crates/hd_run_wasmtime", "crates/hd_sched", "crates/hd_cache", "crates/hd_deps", "crates/hd_driver", "crates/hd_doc", "crates/hd_stdpack", "crates/hd_web", "crates/hd_wat", "crates/hd_testkit", "crates/hd_cli"]
# wasmtime and cranelift are most of a cold build, so plain `cargo build`,
# `cargo test` and `cargo clippy` leave `hd_run_wasmtime` out. `--workspace`
# or `--features wasmtime` brings it in (see crates/README.md, "Wasmtime Engine").
default-members = ["crates/hd_base", "crates/hd_intern", "crates/hd_diag", "crates/hd_syntax", "crates/hd_fmt", "crates/hd_project", "crates/hd_types", "crates/hd_resolve", "crates/hd_tir", "crates/hd_structure", "crates/hd_check", "crates/hd_lint", "crates/hd_mono", "crates/hd_opt", "crates/hd_host_abi", "crates/hd_wasm", "crates/hd_run", "crates/hd_sched", "crates/hd_cache", "crates/hd_deps", "crates/hd_driver", "crates/hd_doc", "crates/hd_stdpack", "crates/hd_web", "crates/hd_wat", "crates/hd_testkit", "crates/hd_cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
implicit_hasher = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"

# Light optimization in dev keeps debug assertions and overflow checks on
# while tests run about as fast as release (local gate ~81 s against
# ~178 s at opt-level 0; owner, 2026-10-11, task #299).
#
# A one-line hd_tir edit rebuilds the gate's binaries in 353 G instructions, not
# 1,040 G. Local ThinLTO was most of that, and full debuginfo most of the rest.
# Tests run 8% more instructions for it. Backtraces keep their files and lines;
# a debugger loses local variables.
[profile.dev]
opt-level = 1
lto = "off"
debug = "line-tables-only"

# The playground's compiler wasm (scripts/build-web-compiler.ts, which
# also compresses the linker's relocations). Only that build selects it
# (crates/hd_web/DESIGN.md §4). `opt-level = "s"`, not "z": "z" cut the
# gzip download by 167 KB but made compiles about 25% slower (cold 185 ->
# 230 ms, warm 3.4 -> 4.5 ms); the owner prefers compile speed (#49).
[profile.web]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true

# These crates build at "z" in the web profile only (owner, #1181): the
# download is 127 KB smaller (gzip 1,983,815 -> 1,857,224) for compiles
# about 6% slower (json cold 872 -> 921 ms, warm 34 -> 35 ms). The hot
# crates (hd_wasm, hd_tir, hd_types, hd_mono, hd_syntax, hd_base)
# stay at "s". A package override drops the profile's `strip`, so
# hd_web's restates it.
[profile.web.package.hd_check]
opt-level = "z"
[profile.web.package.hd_driver]
opt-level = "z"
[profile.web.package.hd_resolve]
opt-level = "z"
[profile.web.package.hd_project]
opt-level = "z"
[profile.web.package.hd_host_abi]
opt-level = "z"
[profile.web.package.hd_structure]
opt-level = "z"
[profile.web.package.hd_opt]
opt-level = "z"
[profile.web.package.hd_diag]
opt-level = "z"
[profile.web.package.hd_cache]
opt-level = "z"
[profile.web.package.hd_web]
opt-level = "z"
strip = true
[profile.web.package.wasm-encoder]
opt-level = "z"
[profile.web.package.toml]
opt-level = "z"
[profile.web.package.toml_parser]
opt-level = "z"
[profile.web.package.winnow]
opt-level = "z"
