[package]
name = "hd_walk"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Walking skeleton: a tiny hd subset through every stage of the designed architecture"

[dependencies]
hd_base = { path = "../hd_base" }
hd_intern = { path = "../hd_intern" }
hd_syntax = { path = "../hd_syntax" }
