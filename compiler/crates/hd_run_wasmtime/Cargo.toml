[package]
name = "hd_run_wasmtime"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hd_cache = { path = "../hd_cache" }
hd_host_abi = { path = "../hd_host_abi" }
hd_run = { path = "../hd_run" }
getrandom = "0.4"
hostname = "0.4"
libc = "0.2"
socket2 = "0.6"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde_json = "1"
# The engine of engines-and-test-runner.md §18.1: Cranelift, Wasm GC with
# the copying collector, and nothing the CLI does not use (no component
# model, no async, no WASI). Pooling is selected only by the test engine.
wasmtime = { version = "=49.0.2", default-features = false, features = [
    "cranelift",
    "gc",
    "gc-copying",
    "parallel-compilation",
    "pooling-allocator",
    "runtime",
    "std",
] }

[lints]
workspace = true

[dev-dependencies]
wasm-encoder = "=0.258.3"

[target.'cfg(windows)'.dependencies]
interprocess = { version = "=2.4.4", default-features = false }
winapi-util = "=0.1.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "poll"] }
# Wasmtime's initial Unix mmap allocation reports this concrete errno type.
rustix = { version = "=1.1.5", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dev-dependencies]
# Regression watchdogs must release deliberately blocked child fixtures.
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
